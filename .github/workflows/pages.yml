name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/wizardly-darwin-i2h6d6]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build questions.js from questions.json
        run: python3 build.py

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/questions.js _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
