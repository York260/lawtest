<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>警察法規刷題</title>
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --text: #1d232b; --muted: #66707c; --line: #dde1e6;
  --accent: #2458c6; --accent-soft: #e8eefb; --ok: #1a7f45; --ok-soft: #e4f4ea;
  --bad: #c22f2f; --bad-soft: #fbe8e8; --warn: #9a6400;
  --alt: #7b3fc4; --alt-soft: #f0e8fb; --free: #b25e00; --free-soft: #fdeed8;
  --hl: #fff08a; --elim-line: #e8a0a0; --elim-bg: #fdf3f3;
  --fs: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --card: #1d2127; --text: #e6e9ed; --muted: #9aa3ad; --line: #323840;
    --accent: #7ea3f2; --accent-soft: #24304a; --ok: #5cc98a; --ok-soft: #1c3527;
    --bad: #f07b7b; --bad-soft: #402325; --warn: #e0b050; color-scheme: dark;
    --alt: #b993f0; --alt-soft: #2f2245; --free: #f0b45c; --free-soft: #3e2e14;
    --hl: #6b5d12; --elim-line: #8f4d4d; --elim-bg: #2a1f21;
  }
}
  :root[data-theme="dark"] {
  color-scheme: dark; --bg: #14171b; --card: #1d2127; --text: #e6e9ed; --muted: #9aa3ad; --line: #323840;
  --accent: #7ea3f2; --accent-soft: #24304a; --ok: #5cc98a; --ok-soft: #1c3527;
  --bad: #f07b7b; --bad-soft: #402325; --warn: #e0b050;
  --alt: #b993f0; --alt-soft: #2f2245; --free: #f0b45c; --free-soft: #3e2e14;
  --hl: #6b5d12; --elim-line: #8f4d4d; --elim-bg: #2a1f21;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  font-size: var(--fs); line-height: 1.7;
}
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
}
.bar { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.bar h1 { font-size: 17px; margin: 0; flex: 1; cursor: pointer; }
.font-ctrl { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.font-ctrl button { width: 36px; height: 32px; padding: 0; font-size: 15px; }
.font-ctrl span { min-width: 38px; text-align: center; color: var(--muted); }
main { max-width: 860px; margin: 0 auto; padding: 16px 16px 60px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 14px; }
button {
  font: inherit; font-size: 15px; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); padding: 8px 14px;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] button.primary { color: #0f1520; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #0f1520; } }
.muted { color: var(--muted); }
.small { font-size: 14px; }
h2 { font-size: 1.15em; margin: 0 0 10px; }
.chapter-title { font-weight: 700; margin-bottom: 8px; }
.sec-list label { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-top: 1px solid var(--line); cursor: pointer; }
.sec-list label:first-of-type { border-top: 0; }
.sec-list input { width: 20px; height: 20px; accent-color: var(--accent); }
.sec-list .count { margin-left: auto; font-size: 14px; color: var(--muted); }
.options-row { display: flex; flex-wrap: wrap; gap: 16px; margin: 6px 0 14px; font-size: 15px; }
.options-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 8px 0 14px; }
.progress div { height: 100%; background: var(--accent); transition: width .2s; }
.q-meta { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
.q-text { margin: 6px 0 14px; font-weight: 500; }
.opt {
  display: flex; gap: 10px; width: 100%; text-align: left; font-size: var(--fs); line-height: 1.6;
  padding: 12px 14px; margin-bottom: 10px; border-radius: 10px;
}
.opt .key { font-weight: 700; flex: none; }
.opt.selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; margin-top: 10px; }
.grid button { padding: 6px 0; font-size: 14px; }
.grid button.done { background: var(--accent-soft); border-color: var(--accent); }
.grid button.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.grid button.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.grid button.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.grid button.alt { background: var(--alt-soft); border-color: var(--alt); color: var(--alt); }
.grid button.free { background: var(--free-soft); border-color: var(--free); color: var(--free); }
.grid button.sp { box-shadow: inset 0 -3px 0 var(--alt); }
.review.alt { border-left: 5px solid var(--alt); }
.review.free { border-left: 5px solid var(--free); }
.review .ro.correct-alt { background: var(--alt-soft); color: var(--alt); font-weight: 600; outline: 1px dashed var(--alt); }
.tag.alt { background: var(--alt-soft); color: var(--alt); }
.tag.free { background: var(--free-soft); color: var(--free); }
.tag.sp { background: transparent; color: var(--alt); border: 1px solid var(--alt); margin-left: 6px; }
.ans-line b.alt { color: var(--alt); }
.ans-line b.free { color: var(--free); }
.sp-note { margin: 10px 0 0; padding: 8px 12px; border-radius: 8px; font-size: .9em; border: 1px solid var(--alt); background: var(--alt-soft); color: var(--alt); }
.sp-note.free { border-color: var(--free); background: var(--free-soft); color: var(--free); }
.at-row.alt { background: var(--alt-soft); }
.at-row.alt .at-correct { color: var(--alt); }
.at-row.free { background: var(--free-soft); }
.at-row.free .at-correct { color: var(--free); }
.chip { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: .8em; margin-left: 6px; border: 1px solid; }
.chip.alt { color: var(--alt); border-color: var(--alt); background: var(--alt-soft); }
.chip.free { color: var(--free); border-color: var(--free); background: var(--free-soft); }
.score { text-align: center; }
.score .big { font-size: 2.4em; font-weight: 700; line-height: 1.2; }
.score .big .of { color: var(--muted); font-size: .55em; font-weight: 500; }
.filter { display: flex; gap: 8px; margin: 4px 0 12px; flex-wrap: wrap; }
.filter button.on { background: var(--accent-soft); border-color: var(--accent); }
.review { scroll-margin-top: 70px; }
.review.right { border-left: 5px solid var(--ok); }
.review.wrong { border-left: 5px solid var(--bad); }
.review .ro { padding: 4px 8px; border-radius: 6px; margin: 2px 0; display: flex; gap: 8px; }
.review .ro.correct { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.review .ro.mine-wrong { background: var(--bad-soft); color: var(--bad); text-decoration: line-through; }
.tag { display: inline-block; font-size: 13px; padding: 1px 8px; border-radius: 10px; margin-left: 6px; vertical-align: 2px; }
.tag.right { background: var(--ok-soft); color: var(--ok); }
.tag.wrong { background: var(--bad-soft); color: var(--bad); }
.ans-line { margin-top: 8px; font-size: .92em; }
.ans-line b.ok { color: var(--ok); }
.ans-line b.bad { color: var(--bad); }
.explain { margin-top: 8px; padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); font-size: .9em; }
.hidden { display: none !important; }
.bar h1 { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 36px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 480px) {
  .bar { gap: 8px; }
  .font-ctrl span { display: none; }
  .hist-btn .long { display: none; }
}
@media (min-width: 481px) { .hist-btn .short { display: none; } }
.opt { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; transition: background-color .15s, border-color .15s; }
.opt.elim { border-color: var(--elim-line); background: var(--elim-bg); }
.opt.elim.selected { box-shadow: inset 0 0 0 1px var(--accent); border-color: var(--accent); }
mark.hl { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 1px; }
.hl-on .q-text, .hl-on .opt { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: pan-y; cursor: crosshair; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20;
  background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 20px; font-size: 14px; pointer-events: none;
  opacity: 0; transition: opacity .2s; }
.toast.show { opacity: .92; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
.hl-on .opt { cursor: crosshair; }
.ch.on { background: var(--hl); }
.ch.pre { background: var(--hl); opacity: .75; }
.ch.erase { background: transparent; text-decoration: line-through; text-decoration-color: var(--muted); }
.tools-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -4px 0 12px; font-size: 13px; }
.tools-row button { font-size: 13px; padding: 4px 10px; display: inline-flex; align-items: center; gap: 4px; }
.tools-row button[aria-pressed="true"] { background: var(--hl); border-color: var(--warn); color: var(--text); }
.tools-row .hint { color: var(--muted); }
.tools-row svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.result-tools { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.at-legend { display: flex; gap: 8px; font-size: 12px; color: var(--muted); margin: 0 0 8px; padding: 0 6px; }
.at-legend .at-num { width: 2.4em; flex: none; }
.at-legend .at-mine, .at-legend .at-correct { min-width: 2.6em; flex: none; text-align: center; }
.at-wrap { column-width: 190px; column-gap: 12px; }
.at-row {
  display: flex; align-items: baseline; gap: 8px; padding: 5px 6px; margin-bottom: 2px;
  break-inside: avoid; border-radius: 6px; font-variant-numeric: tabular-nums; cursor: pointer;
}
.at-row:hover { background: var(--accent-soft); }
.at-row .at-num { width: 2.4em; color: var(--muted); font-size: .85em; flex: none; }
.at-row .at-mine, .at-row .at-correct { min-width: 2.6em; font-weight: 700; text-align: center; flex: none; }
.at-row.wrong { background: var(--bad-soft); }
.at-row.wrong:hover { background: var(--bad-soft); filter: brightness(0.96); }
.at-row.wrong .at-mine { color: var(--bad); text-decoration: line-through; }
.at-row.wrong .at-correct { color: var(--ok); }
.at-row.blank .at-mine { color: var(--muted); }
.at-row.ok .at-correct { color: var(--ok); }
.back-to-top {
  position: fixed; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 15;
  width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: var(--card); border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.18);
  opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .18s, transform .18s;
}
.back-to-top.show { opacity: 1; transform: none; pointer-events: auto; }
.back-to-top svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-reduced-motion: reduce) { .back-to-top { transition: none; } }
.hist-btn { font-size: 14px; padding: 6px 10px; white-space: nowrap; }
.hist-item { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.hist-item .when { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hist-item .label { font-weight: 600; overflow-wrap: anywhere; }
.hist-item .pct { font-size: 1.3em; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.hist-item .pct small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.hist-item .acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.hist-item .del-confirm { color: var(--bad); font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pct.good { color: var(--ok); } .pct.bad { color: var(--bad); }
.hist-note { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
[hidden] { display: none !important; }
.confirm-box { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); font-size: 15px; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 560px) {
  .bar h1 { font-size: 15px; }
  .card { padding: 14px; }
}
</style>
<header>
  <div class="bar">
    <h1 id="homeLink" title="回到章節選擇">警察法規刷題</h1>
    <button id="historyBtn" class="hist-btn"><span class="long">答案卷紀錄</span><span class="short">紀錄</span></button>
    <button id="themeBtn" class="icon-btn" aria-label="切換白天／夜間模式" title="切換白天／夜間模式"></button>
    <div class="font-ctrl" aria-label="文字大小">
      <button id="fontDown" aria-label="縮小文字">A−</button>
      <span id="fontVal">18</span>
      <button id="fontUp" aria-label="放大文字">A＋</button>
    </div>
  </div>
</header>

<main>
  <!-- 選擇章節 -->
  <section id="viewSelect">
    <div class="card">
      <h2>選擇題庫</h2>
      <p class="muted small" id="bankNote"></p>
      <div id="chapterList"></div>
    </div>
    <div class="card">
      <div class="options-row">
        <label><input type="checkbox" id="optShuffle"> 題目順序隨機</label>
      </div>
      <div class="actions">
        <button class="primary" id="startBtn" disabled>開始作答</button>
        <span class="muted small" id="selCount">尚未選擇</span>
      </div>
    </div>
  </section>

  <!-- 作答 -->
  <section id="viewQuiz" class="hidden">
    <div class="card">
      <div class="q-meta"><span id="qSource"></span><span id="qCounter"></span></div>
      <div class="progress"><div id="qProgress"></div></div>
      <div class="tools-row">
        <button id="hlBtn" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>螢光筆</button>
        <button id="hlClear">清除本題標記</button>
        <span class="hint" id="toolHint">長按選項刪去・點空白處開螢光筆</span>
      </div>
      <div class="q-text" id="qText"></div>
      <div id="qOptions"></div>
      <div class="nav">
        <button id="prevBtn">← 上一題</button>
        <button id="nextBtn">下一題 →</button>
      </div>
    </div>
    <div class="card">
      <div class="actions" style="justify-content:space-between">
        <span class="muted small" id="answeredInfo"></span>
        <button class="primary" id="submitBtn">交卷批改</button>
      </div>
      <div class="confirm-box" id="confirmBox" hidden>
        <span id="confirmMsg"></span>
        <span class="actions"><button id="confirmNo">繼續作答</button><button class="primary" id="confirmYes">確定交卷</button></span>
      </div>
      <div class="grid" id="qGrid"></div>
    </div>
  </section>

  <!-- 答案卷紀錄 -->
  <section id="viewHistory" class="hidden">
    <div class="card">
      <h2>答案卷紀錄</h2>
      <p class="hist-note" id="histMode">讀取中…</p>
      <div id="histList"></div>
    </div>
  </section>

  <!-- 結果 -->
  <section id="viewResult" class="hidden">
    <div class="card score">
      <div class="muted small" id="resWhen"></div>
      <div class="muted small" id="resSource"></div>
      <div class="big"><span id="resRight"></span><span class="of"> / <span id="resTotal"></span> 題</span></div>
      <div class="muted small" id="resDetail"></div>
      <div class="actions" style="justify-content:center;margin-top:12px">
        <button id="retryWrongBtn">只重做錯題</button>
        <button id="retryAllBtn">整回重做</button>
        <button id="toHistBtn">答案卷紀錄</button>
        <button class="primary" id="backBtn">回章節選擇</button>
      </div>
    </div>
    <div class="grid" id="resGrid" style="margin-bottom:14px"></div>
    <div class="result-tools">
      <div class="filter" id="resFilter">
        <button data-f="all" class="on">全部</button>
        <button data-f="wrong">只看錯題</button>
        <button data-f="right">只看答對</button>
      </div>
      <div class="filter" id="resMode">
        <button data-m="detail" class="on">詳細列表</button>
        <button data-m="table">一覽表</button>
      </div>
    </div>
    <div id="resList"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<button class="back-to-top" id="backToTopBtn" aria-label="回到最頂">
  <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>
<script src="data/questions.js"></script>
<script>
(function () {
  const BANK = window.QUESTION_BANK;
  const KEYS = ["A", "B", "C", "D", "E"];
  const optKeys = (q) => KEYS.filter((k) => q.options[k]);
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---- 文字大小 ----
  let fs = store.get("fontSize", 18);
  function applyFont() {
    document.documentElement.style.setProperty("--fs", fs + "px");
    $("fontVal").textContent = fs;
    $("fontDown").disabled = fs <= 14;
    $("fontUp").disabled = fs >= 30;
    store.set("fontSize", fs);
  }
  $("fontDown").onclick = () => { fs = Math.max(14, fs - 2); applyFont(); };
  $("fontUp").onclick = () => { fs = Math.min(30, fs + 2); applyFont(); };
  applyFont();

  // ---- 白天／夜間模式 ----
  const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  const darkMQ = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  let theme = store.get("theme", null); // null = 跟隨系統
  function effectiveTheme() { return theme || (darkMQ && darkMQ.matches ? "dark" : "light"); }
  function applyTheme() {
    if (theme) document.documentElement.setAttribute("data-theme", theme);
    const dark = effectiveTheme() === "dark";
    $("themeBtn").innerHTML = dark ? SUN : MOON;
    $("themeBtn").title = $("themeBtn").ariaLabel = dark ? "切換為白天模式" : "切換為夜間模式";
  }
  $("themeBtn").onclick = () => {
    theme = effectiveTheme() === "dark" ? "light" : "dark";
    store.set("theme", theme);
    applyTheme();
  };
  if (darkMQ && darkMQ.addEventListener) darkMQ.addEventListener("change", () => { if (!theme) applyTheme(); });
  applyTheme();

  // ---- 章節選擇 ----
  const sectionMap = {};
  BANK.chapters.forEach((ch) => ch.sections.forEach((s) => { sectionMap[s.id] = { ch, s }; }));
  $("bankNote").textContent = BANK.note || "";

  function renderSelect() {
    const saved = store.get("selectedSections", []);
    $("chapterList").innerHTML = BANK.chapters.map((ch) => {
      const total = ch.sections.reduce((n, s) => n + s.questions.length, 0);
      return `<div class="card" style="margin:10px 0 0;padding:12px 14px">
        <div class="chapter-title">Chapter ${ch.chapter}　${esc(ch.title)} <span class="muted small">（${total} 題）</span></div>
        <div class="sec-list">
          <label><input type="checkbox" class="ch-all" data-ch="${ch.id}"> <b>整章全部</b><span class="count">${total} 題</span></label>
          ${ch.sections.map((s) => `<label><input type="checkbox" class="sec" data-ch="${ch.id}" value="${s.id}" ${saved.includes(s.id) ? "checked" : ""}>
            ${esc(s.title)}<span class="count">${s.questions.length} 題</span></label>`).join("")}
        </div></div>`;
    }).join("");
    document.querySelectorAll(".ch-all").forEach((box) => {
      box.onchange = () => {
        document.querySelectorAll(`.sec[data-ch="${box.dataset.ch}"]`).forEach((b) => (b.checked = box.checked));
        updateSel();
      };
    });
    document.querySelectorAll(".sec").forEach((b) => (b.onchange = updateSel));
    $("optShuffle").checked = store.get("shuffle", false);
    updateSel();
  }
  function selectedIds() { return [...document.querySelectorAll(".sec:checked")].map((b) => b.value); }
  function updateSel() {
    BANK.chapters.forEach((ch) => {
      const secs = [...document.querySelectorAll(`.sec[data-ch="${ch.id}"]`)];
      const all = document.querySelector(`.ch-all[data-ch="${ch.id}"]`);
      all.checked = secs.every((b) => b.checked);
      all.indeterminate = !all.checked && secs.some((b) => b.checked);
    });
    const ids = selectedIds();
    const n = ids.reduce((t, id) => t + sectionMap[id].s.questions.length, 0);
    $("selCount").textContent = ids.length ? `已選 ${ids.length} 回，共 ${n} 題` : "尚未選擇";
    $("startBtn").disabled = !ids.length;
  }
  $("startBtn").onclick = () => {
    const ids = selectedIds();
    store.set("selectedSections", ids);
    store.set("shuffle", $("optShuffle").checked);
    let qs = [];
    ids.forEach((id) => {
      const { ch, s } = sectionMap[id];
      s.questions.forEach((q) => qs.push({ ...q, src: `Ch${ch.chapter} ${ch.title}・${s.title}` }));
    });
    if ($("optShuffle").checked) shuffle(qs);
    const label = ids.map((id) => `Ch${sectionMap[id].ch.chapter} ${sectionMap[id].s.title}`).join("、");
    startQuiz(qs, label);
  };
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  // ---- 作答 ----
  let quiz = null; // { qs, answers, idx, label }
  function show(view) {
    ["viewSelect", "viewQuiz", "viewResult", "viewHistory"].forEach((v) => $(v).classList.toggle("hidden", v !== view));
    window.scrollTo(0, 0);
  }
  function startQuiz(qs, label) {
    quiz = { qs, answers: new Array(qs.length).fill(null), idx: 0, label, marks: {}, elim: {} };
    saveProgress();
    renderQuiz();
    show("viewQuiz");
  }
  function saveProgress() { store.set("progress", quiz ? { ids: quiz.qs.map((q) => q.id), answers: quiz.answers, idx: quiz.idx, label: quiz.label, marks: quiz.marks, elim: quiz.elim } : null); }

  function renderQuiz() {
    const q = quiz.qs[quiz.idx];
    const n = quiz.qs.length;
    $("qSource").textContent = `${q.src}　第 ${q.number} 題`;
    $("qCounter").textContent = `${quiz.idx + 1} / ${n}`;
    $("qProgress").style.width = ((quiz.idx + 1) / n) * 100 + "%";
    const mk = quiz.marks[q.id] || {};
    const el = quiz.elim[q.id] || "";
    const txt = (t, f) => (hlMode ? charHTML(t, mk[f]) : markHTML(t, mk[f]));
    $("qText").innerHTML = (isMulti(q) ? "【複選】" : "") + `<span class="hl-target" data-f="q">${txt(q.question, "q")}</span>`;
    const oldNote = document.getElementById("spNote"); if (oldNote) oldNote.remove();
    $("qOptions").innerHTML = optKeys(q).map((k) =>
      `<button class="opt ${(quiz.answers[quiz.idx] || "").includes(k) ? "selected" : ""} ${el.includes(k) ? "elim" : ""}" data-k="${k}"><span class="key">(${k})</span><span class="hl-target" data-f="${k}">${txt(q.options[k], k)}</span></button>`
    ).join("");
    document.querySelectorAll(".opt").forEach(bindOption);
    $("hlClear").disabled = !quiz.marks[q.id] && !quiz.elim[q.id];
    $("prevBtn").disabled = quiz.idx === 0;
    $("nextBtn").textContent = quiz.idx === n - 1 ? "最後一題" : "下一題 →";
    $("nextBtn").disabled = quiz.idx === n - 1;
    const done = quiz.answers.filter(Boolean).length;
    $("answeredInfo").textContent = `已作答 ${done} / ${n}　（點題號可跳題）`;
    $("qGrid").innerHTML = quiz.qs.map((_, i) =>
      `<button data-i="${i}" class="${quiz.answers[i] ? "done" : ""} ${i === quiz.idx ? "cur" : ""} ${isSpecial(quiz.qs[i]) ? "sp" : ""}">${i + 1}</button>`
    ).join("");
    document.querySelectorAll("#qGrid button").forEach((b) => (b.onclick = () => go(+b.dataset.i)));
  }
  function isMulti(q) { return q.multi || (q.accepted || [q.answer]).some((a) => a.length > 1); }
  // 特殊題：accepted＝所有給分答案；full_credit＝本題無正確答案、一律給分
  // 批改狀態：ok 答對｜alt 答了另一個給分答案｜free 一律給分（送分）｜wrong 答錯｜blank 未作答
  function gradeStatus(q, mine) {
    if (q.full_credit) return "free";
    if (!mine) return "blank";
    if (q.accepted) return q.accepted[0] === mine ? "ok" : q.accepted.includes(mine) ? "alt" : "wrong";
    return mine === q.answer ? "ok" : "wrong";
  }
  const isOkStatus = (st) => st === "ok" || st === "alt" || st === "free";
  function isCorrect(q, mine) { return isOkStatus(gradeStatus(q, mine)); }
  function isSpecial(q) { return !!q.full_credit || !!(q.accepted && q.accepted.length > 1); }
  function mkRes(q, mine) { const st = gradeStatus(q, mine); return { q, mine, st, ok: isOkStatus(st) }; }
  function primaryKeys(q) { return q.full_credit ? [] : [...new Set((q.accepted ? q.accepted[0] : q.answer).split(""))]; }
  function correctKeys(q) { return q.full_credit ? [] : [...new Set((q.accepted || [q.answer]).join("").split(""))]; }
  function answerText(q) { return q.full_credit ? "本題無正確答案，一律給分" : (q.accepted || [q.answer]).map((a) => "(" + a + ")").join(" 或 "); }
  const ST_TAG = { ok: "答對", alt: "答對（另一給分答案）", free: "一律給分", wrong: "答錯", blank: "未作答" };
  const ST_GRID = { ok: "right", alt: "alt", free: "free", wrong: "wrong", blank: "wrong" };
  const ST_ROW = { ok: "ok", alt: "alt", free: "free", wrong: "wrong", blank: "blank" };
  function spNote(q) {
    if (q.full_credit) return `<div class="sp-note free" id="spNote">本題無正確答案，一律給分（作答與否皆算對）</div>`;
    if (isSpecial(q)) return `<div class="sp-note" id="spNote">本題有多個給分答案：${esc(answerText(q))}</div>`;
    return "";
  }
  // 歷史紀錄用：以目前題庫重新統計
  function recStats(rec) {
    let right = 0, alt = 0, free = 0, total = 0;
    rec.qids.forEach((id, i) => {
      const q = byId[id]; if (!q) return;
      total++; const st = gradeStatus(q, rec.mine[i] || null);
      if (isOkStatus(st)) right++;
      if (st === "alt") alt++;
      if (st === "free") free++;
    });
    return { right, total, alt, free };
  }
  function choose(k) {
    const qid = quiz.qs[quiz.idx].id;
    const cur = quiz.answers[quiz.idx] || "";
    if (!cur.includes(k) && (quiz.elim[qid] || "").includes(k)) setElim(qid, quiz.elim[qid].replace(k, ""));
    if (isMulti(quiz.qs[quiz.idx])) {
      const next = (cur.includes(k) ? cur.replace(k, "") : cur + k).split("").sort().join("");
      quiz.answers[quiz.idx] = next || null;
    } else {
      quiz.answers[quiz.idx] = cur === k ? null : k;
    }
    saveProgress();
    renderQuiz();
  }
  function go(i) {
    if (i < 0 || i >= quiz.qs.length) return;
    quiz.idx = i;
    saveProgress();
    renderQuiz();
  }
  $("prevBtn").onclick = () => go(quiz.idx - 1);
  $("nextBtn").onclick = () => go(quiz.idx + 1);
  document.addEventListener("keydown", (e) => {
    if ($("viewQuiz").classList.contains("hidden") || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toUpperCase();
    const ks = optKeys(quiz.qs[quiz.idx]);
    if (ks.includes(k)) choose(k);
    else if (/^[1-5]$/.test(e.key) && ks[+e.key - 1]) choose(ks[+e.key - 1]);
    else if (e.key === "ArrowLeft") go(quiz.idx - 1);
    else if (e.key === "ArrowRight") go(quiz.idx + 1);
  });

  $("submitBtn").onclick = () => {
    const left = quiz.answers.filter((a, i) => !a && !quiz.qs[i].full_credit).length;  // 一律給分的題不算未作答
    if (!left) return grade();
    $("confirmMsg").textContent = `還有 ${left} 題未作答，確定要交卷嗎？（未作答以答錯計）`;
    $("confirmBox").hidden = false;
  };
  $("confirmNo").onclick = () => { $("confirmBox").hidden = true; };
  $("confirmYes").onclick = () => { $("confirmBox").hidden = true; grade();
  };

  // ---- 螢光筆 ----
  // 標記以「字元位置」存：marks[題目id] = { q: [[起, 迄], …], A: [...], … }
  let hlMode = false;
  function markHTML(text, ranges) {
    if (!ranges || !ranges.length) return esc(text);
    let out = "", pos = 0;
    ranges.forEach(([a, b], i) => {
      out += esc(text.slice(pos, a)) + `<mark class="hl" data-i="${i}">${esc(text.slice(a, b))}</mark>`;
      pos = b;
    });
    return out + esc(text.slice(pos));
  }
  function mergeRanges(rs) {
    rs = rs.filter(([a, b]) => b > a).sort((x, y) => x[0] - y[0]);
    const out = [];
    rs.forEach((r) => {
      const last = out[out.length - 1];
      if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
      else out.push([r[0], r[1]]);
    });
    return out;
  }
  // 螢光筆開啟時把文字拆成一個個字，手指滑過的字就畫上螢光（不用瀏覽器的文字選取）
  function charHTML(text, ranges) {
    const on = new Array(text.length).fill(false);
    (ranges || []).forEach(([x, y]) => { for (let i = x; i < y; i++) on[i] = true; });
    return text.split("").map((c, i) => `<span class="ch${on[i] ? " on" : ""}" data-i="${i}">${esc(c)}</span>`).join("");
  }
  function setMarks(qid, mk) {
    Object.keys(mk).forEach((f) => { if (!mk[f].length) delete mk[f]; });
    if (Object.keys(mk).length) quiz.marks[qid] = mk; else delete quiz.marks[qid];
    saveProgress();
  }
  function setHlMode(on) {
    hlMode = on;
    $("hlBtn").setAttribute("aria-pressed", on ? "true" : "false");
    $("viewQuiz").classList.toggle("hl-on", on);
    $("toolHint").textContent = on ? "點一下畫一個字・點螢光擦掉整段・左右滑畫一段・點空白處關閉" : "長按選項刪去・點空白處開螢光筆";
    renderQuiz();
  }
  let toastTimer = null;
  function toast(msg) {
    $("toast").textContent = msg;
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $("toast").classList.remove("show"), 1200);
  }
  // 作答畫面點空白處 = 開／關螢光筆（點到文字、選項、按鈕、題號格不算）
  // 用手指實際按下的位置判斷；手機瀏覽器會把「點在按鈕附近」自動算成點按鈕，所以之後那一下 click 要攔掉
  const NOT_BLANK = "button, .opt, .ch, .q-text, .grid, .tools-row, .nav, .confirm-box, .q-meta, .progress, #answeredInfo, input, label, a, mark";
  let tapStart = null, swallowClickUntil = 0;
  document.addEventListener("pointerdown", (e) => {
    tapStart = null;
    const hit = document.elementFromPoint(e.clientX, e.clientY); // 手指正下方的元素（不受瀏覽器自動校正影響）
    if ($("viewQuiz").classList.contains("hidden") || !hit || !hit.closest("main") || hit.closest(NOT_BLANK)) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    tapStart = { x: e.clientX, y: e.clientY, t: Date.now(), id: e.pointerId };
  }, true);
  document.addEventListener("pointerup", (e) => {
    const st = tapStart;
    tapStart = null;
    if (!st || st.id !== e.pointerId || Date.now() - st.t > 400 || Math.hypot(e.clientX - st.x, e.clientY - st.y) > 10) return;
    swallowClickUntil = Date.now() + 600;
    setHlMode(!hlMode);
    toast(hlMode ? "螢光筆：開" : "螢光筆：關");
  }, true);
  document.addEventListener("pointercancel", () => { tapStart = null; }, true);
  document.addEventListener("click", (e) => {
    if (Date.now() < swallowClickUntil) {
      swallowClickUntil = 0;
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);
  $("hlBtn").onclick = () => { setHlMode(!hlMode); toast(hlMode ? "螢光筆：開" : "螢光筆：關"); };
  $("hlClear").onclick = () => {
    const qid = quiz.qs[quiz.idx].id;
    delete quiz.marks[qid];
    delete quiz.elim[qid];
    saveProgress();
    renderQuiz();
  };

  // 畫的動作：按下的字 → 滑到的字（同一段文字內），放開時存起來
  let paint = null; // { target, f, start, end, erase }
  const chAt = (x, y) => {
    const el = document.elementFromPoint(x, y);
    return el && el.classList.contains("ch") ? el : null;
  };
  function paintPreview() {
    const lo = Math.min(paint.start, paint.end), hi = Math.max(paint.start, paint.end);
    paint.target.querySelectorAll(".ch").forEach((c) => {
      const i = +c.dataset.i, inside = i >= lo && i <= hi;
      c.classList.toggle("pre", inside && !paint.erase);
      c.classList.toggle("erase", inside && paint.erase);
    });
  }
  $("viewQuiz").addEventListener("pointerdown", (e) => {
    if (!hlMode) return;
    const c = chAt(e.clientX, e.clientY);
    if (!c) return;
    e.preventDefault();
    const target = c.closest(".hl-target");
    // 從已經畫過的字開始滑 = 擦掉
    paint = { target, f: target.dataset.f, start: +c.dataset.i, end: +c.dataset.i, erase: c.classList.contains("on"), id: e.pointerId };
    try { $("viewQuiz").setPointerCapture(e.pointerId); } catch (err) {}
    paintPreview();
  });
  $("viewQuiz").addEventListener("pointermove", (e) => {
    if (!paint || e.pointerId !== paint.id) return;
    e.preventDefault();
    const c = chAt(e.clientX, e.clientY);
    if (c && c.closest(".hl-target") === paint.target && +c.dataset.i !== paint.end) {
      paint.end = +c.dataset.i;
      paintPreview();
    }
  });
  function endPaint(e) {
    if (!paint || e.pointerId !== paint.id) return;
    const q = quiz.qs[quiz.idx];
    const mk = JSON.parse(JSON.stringify(quiz.marks[q.id] || {}));
    const lo = Math.min(paint.start, paint.end), hi = Math.max(paint.start, paint.end) + 1;
    const cur = mk[paint.f] || [];
    if (paint.erase) {
      // 點一下擦掉整段連續的螢光；滑過擦掉滑過的字
      const [x, y] = lo + 1 === hi ? cur.find(([a, b]) => a <= lo && lo < b) || [lo, hi] : [lo, hi];
      mk[paint.f] = mergeRanges(cur.flatMap(([a, b]) => [[a, Math.min(b, x)], [Math.max(a, y), b]]));
    } else {
      mk[paint.f] = mergeRanges([...cur, [lo, hi]]);
    }
    paint = null;
    setMarks(q.id, mk);
    renderQuiz();
  }
  $("viewQuiz").addEventListener("pointerup", endPaint);
  $("viewQuiz").addEventListener("pointercancel", (e) => { if (paint && e.pointerId === paint.id) { paint = null; renderQuiz(); } });

  // ---- 長按選項 = 刪去法 ----
  function setElim(qid, v) {
    v = v.split("").sort().join("");
    if (v) quiz.elim[qid] = v; else delete quiz.elim[qid];
    saveProgress();
  }
  function bindOption(b) {
    const k = b.dataset.k;
    let timer = null, longPressed = false, sx = 0, sy = 0;
    const cancel = () => { clearTimeout(timer); timer = null; };
    b.addEventListener("pointerdown", (e) => {
      if (hlMode || (e.pointerType === "mouse" && e.button !== 0)) return;
      longPressed = false;
      sx = e.clientX; sy = e.clientY;
      timer = setTimeout(() => {
        longPressed = true;
        const qid = quiz.qs[quiz.idx].id;
        const cur = quiz.elim[qid] || "";
        setElim(qid, cur.includes(k) ? cur.replace(k, "") : cur + k);
        if (navigator.vibrate) try { navigator.vibrate(15); } catch (err) {}
        renderQuiz();
      }, 500);
    });
    b.addEventListener("pointermove", (e) => { if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel(); });
    ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => b.addEventListener(ev, cancel));
    b.addEventListener("contextmenu", (e) => e.preventDefault());
    b.addEventListener("click", () => {
      if (hlMode || longPressed) { longPressed = false; return; }
      choose(k);
    });
  }

  // ---- 批改結果 ----
  let filter = "all";
  let viewMode = store.get("resViewMode", "detail");
  function grade() {
    const rec = {
      id: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      ts: Date.now(),
      label: quiz.label,
      qids: quiz.qs.map((q) => q.id),
      mine: quiz.answers.map((a) => a || ""),
      marks: quiz.marks,
    };
    const res = quiz.qs.map((q, i) => mkRes(q, quiz.answers[i]));
    rec.right = res.filter((r) => r.ok).length;
    rec.alt = res.filter((r) => r.st === "alt").length;
    rec.free = res.filter((r) => r.st === "free").length;
    rec.total = res.length;
    store.set("progress", null);
    History.add(rec);
    showResult(res, quiz.label, rec.ts);
  }
  function showResult(res, label, ts) {
    const right = res.filter((r) => r.ok).length;
    const blank = res.filter((r) => r.st === "blank").length;
    const nAlt = res.filter((r) => r.st === "alt").length, nFree = res.filter((r) => r.st === "free").length;
    quiz.result = res;
    $("resWhen").textContent = ts ? "作答時間：" + fmtTime(ts) : "";
    $("resSource").textContent = label;
    $("resRight").textContent = right;
    $("resTotal").textContent = res.length;
    $("resDetail").innerHTML = `答對 ${right} 題・答錯 ${res.length - right - blank} 題・未作答 ${blank} 題・正確率 ${res.length ? Math.round((right / res.length) * 100) : 0}%`
      + (nAlt ? `<span class="chip alt">另一給分答案 ${nAlt} 題</span>` : "") + (nFree ? `<span class="chip free">一律給分 ${nFree} 題</span>` : "");
    $("retryWrongBtn").disabled = right === res.length;
    document.querySelectorAll("#resMode button").forEach((b) => b.classList.toggle("on", b.dataset.m === viewMode));
    $("resGrid").innerHTML = res.map((r, i) => `<button data-i="${i}" class="${ST_GRID[r.st]} ${isSpecial(r.q) ? "sp" : ""}">${i + 1}</button>`).join("");
    document.querySelectorAll("#resGrid button").forEach((b) => (b.onclick = () => {
      setFilter("all");
      setMode("detail");
      document.getElementById("r" + b.dataset.i).scrollIntoView({ behavior: "smooth", block: "start" });
    }));
    setFilter("all");
    show("viewResult");
  }
  function fmtTime(ts) {
    const d = new Date(ts), z = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}/${z(d.getMonth() + 1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
  }
  function setFilter(f) {
    filter = f;
    document.querySelectorAll("#resFilter button").forEach((b) => b.classList.toggle("on", b.dataset.f === f));
    renderResultList();
  }
  document.querySelectorAll("#resFilter button").forEach((b) => (b.onclick = () => setFilter(b.dataset.f)));
  function setMode(m) {
    viewMode = m;
    store.set("resViewMode", m);
    document.querySelectorAll("#resMode button").forEach((b) => b.classList.toggle("on", b.dataset.m === m));
    renderResultList();
  }
  document.querySelectorAll("#resMode button").forEach((b) => (b.onclick = () => setMode(b.dataset.m)));
  function renderResultList() {
    const items = quiz.result.map((r, i) => ({ ...r, i })).filter((r) => filter === "all" || (filter === "wrong" ? !r.ok : r.ok));
    if (viewMode === "table") { renderAnswerTable(items); return; }
    $("resList").innerHTML = items.length ? items.map(({ q, mine, ok, st, i }) => `
      <div class="card review ${ST_GRID[st]}" id="r${i}">
        <div class="q-meta"><span>${i + 1}.　${esc(q.src)}　第 ${q.number} 題</span>
          <span><span class="tag ${ST_GRID[st]}">${ST_TAG[st]}</span>${isSpecial(q) ? `<span class="tag sp">特殊題</span>` : ""}</span></div>
        <div class="q-text">${markHTML(q.question, (quiz.marks[q.id] || {}).q)}</div>
        ${optKeys(q).map((k) => `<div class="ro ${primaryKeys(q).includes(k) ? "correct" : correctKeys(q).includes(k) ? "correct-alt" : (mine || "").includes(k) && !q.full_credit ? "mine-wrong" : ""}"><span>(${k})</span><span>${markHTML(q.options[k], (quiz.marks[q.id] || {})[k])}</span></div>`).join("")}
        <div class="ans-line">你的答案：<b class="${st === "alt" ? "alt" : st === "free" ? "free" : ok ? "ok" : "bad"}">${mine ? "(" + mine + ")" : "未作答"}</b>　正確答案：<b class="${q.full_credit ? "free" : isSpecial(q) ? "alt" : "ok"}">${answerText(q)}</b></div>
        ${q.explanation ? `<div class="explain">解析：${esc(q.explanation)}</div>` : ""}
      </div>`).join("") : `<div class="card muted">沒有符合的題目</div>`;
  }
  // 一覽表：題號／你的答案／正確答案，方便對照謄到實體考卷；點一列可跳到該題詳解
  function renderAnswerTable(items) {
    if (!items.length) { $("resList").innerHTML = `<div class="card muted">沒有符合的題目</div>`; return; }
    const rows = items.map(({ q, mine, st, i }) => `
      <div class="at-row ${ST_ROW[st]}" data-i="${i}">
        <span class="at-num">${i + 1}</span>
        <span class="at-mine">${mine ? esc(mine) : "－"}</span>
        <span class="at-correct">${q.full_credit ? "一律給分" : esc((q.accepted || [q.answer]).join(" / "))}</span>
      </div>`).join("");
    $("resList").innerHTML = `<div class="card">
      <div class="at-legend"><span class="at-num">題號</span><span class="at-mine">你的</span><span class="at-correct">正確</span>
        <span class="muted">・點一列可看詳解；紅底＝答錯、紫底＝另一給分答案、橘底＝一律給分</span></div>
      <div class="at-wrap">${rows}</div>
    </div>`;
  }
  // 一覽表點列 → 切回詳細列表並捲到該題（監聽掛在容器上，重新渲染後仍有效）
  $("resList").addEventListener("click", (e) => {
    const row = e.target.closest(".at-row");
    if (!row) return;
    setMode("detail");
    document.getElementById("r" + row.dataset.i)?.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("retryWrongBtn").onclick = () => {
    const wrong = quiz.result.filter((r) => !r.ok).map((r) => r.q);
    const marks = quiz.marks;
    startQuiz(wrong, quiz.label + "（錯題重做）");
    quiz.marks = marks; saveProgress(); renderQuiz();
  };
  $("retryAllBtn").onclick = () => {
    const qs = quiz.qs.slice();
    if (store.get("shuffle", false)) shuffle(qs);
    startQuiz(qs, quiz.label.replace(/（錯題重做）$/, ""));
  };
  $("backBtn").onclick = () => { quiz = null; renderSelect(); show("viewSelect"); };
  $("homeLink").onclick = () => {
    renderSelect();
    show("viewSelect");
    offerResume();
  };

  // ---- 續做上次進度 ----
  const byId = {};
  BANK.chapters.forEach((ch) => ch.sections.forEach((s) => s.questions.forEach((q) => {
    byId[q.id] = { ...q, src: `Ch${ch.chapter} ${ch.title}・${s.title}` };
  })));
  function offerResume() {
    const p = store.get("progress", null);
    const old = document.getElementById("resumeCard");
    if (old) old.remove();
    if (!p || !p.ids || !p.ids.every((id) => byId[id])) return;
    const done = p.answers.filter(Boolean).length;
    const card = document.createElement("div");
    card.className = "card";
    card.id = "resumeCard";
    card.innerHTML = `<div class="actions" style="justify-content:space-between">
      <span>上次未完成：${esc(p.label)}（已作答 ${done} / ${p.ids.length}）</span>
      <span class="actions"><button id="discardBtn">放棄</button><button class="primary" id="resumeBtn">繼續作答</button></span></div>`;
    $("viewSelect").prepend(card);
    $("resumeBtn").onclick = () => {
      quiz = { qs: p.ids.map((id) => byId[id]), answers: p.answers, idx: p.idx || 0, label: p.label, marks: p.marks || {}, elim: p.elim || {} };
      renderQuiz();
      show("viewQuiz");
    };
    $("discardBtn").onclick = () => { store.set("progress", null); card.remove(); };
  }

  // ---- 答案卷紀錄（存在這個瀏覽器） ----
  const History = {
    list: store.get("history", []),
    save() {
      this.list.sort((a, b) => b.ts - a.ts);
      this.list = this.list.slice(0, 100);
      store.set("history", this.list);
      // 空間不足時丟掉最舊的幾份再存
      while (this.list.length && JSON.stringify(store.get("history", [])) !== JSON.stringify(this.list)) {
        this.list.pop();
        store.set("history", this.list);
      }
    },
    add(rec) { this.list.unshift(rec); this.save(); },
    remove(id) { this.list = this.list.filter((r) => r.id !== id); this.save(); },
  };

  function renderHistory() {
    $("histMode").textContent = "紀錄存在這個瀏覽器裡（換瀏覽器或清除網站資料就會不見），最多保留最近 100 份。";
    const list = History.list.slice().sort((a, b) => b.ts - a.ts);
    if (!list.length) {
      $("histList").innerHTML = `<p class="muted">還沒有答案卷。交卷批改後會自動存在這裡。</p>`;
      return;
    }
    $("histList").innerHTML = list.map((r0) => {
      const r = { ...r0, ...recStats(r0) };  // 以目前題庫重新統計（含特殊題）
      const pct = r.total ? Math.round((r.right / r.total) * 100) : 0;
      return `<div class="card hist-item" data-id="${esc(r.id)}" style="margin:10px 0 0">
        <div><div class="when">${fmtTime(r.ts)}</div><div class="label">${esc(r.label)}${r.alt ? `<span class="chip alt">另一給分答案 ${r.alt}</span>` : ""}${r.free ? `<span class="chip free">一律給分 ${r.free}</span>` : ""}</div></div>
        <div class="pct ${pct >= 80 ? "good" : pct < 60 ? "bad" : ""}">${pct}%<small>${r.right} / ${r.total} 題</small></div>
        <div class="acts">
          <button class="primary" data-act="view">查看答案卷</button>
          <button data-act="del">刪除</button>
        </div></div>`;
    }).join("");
    document.querySelectorAll(".hist-item").forEach((el) => {
      const rec = History.list.find((r) => r.id === el.dataset.id);
      el.querySelector('[data-act="view"]').onclick = () => openRecord(rec);
      el.querySelector('[data-act="del"]').onclick = (e) => {
        const acts = el.querySelector(".acts");
        acts.innerHTML = `<span class="del-confirm">確定刪除這份答案卷？<button data-act="no">取消</button><button class="primary" data-act="yes">刪除</button></span>`;
        acts.querySelector('[data-act="no"]').onclick = renderHistory;
        acts.querySelector('[data-act="yes"]').onclick = () => { History.remove(rec.id); renderHistory(); };
      };
    });
  }
  function openRecord(rec) {
    // 題庫之後若有更正，這裡以目前題庫的題目與答案重新批改
    const pairs = rec.qids.map((id, i) => ({ q: byId[id], mine: rec.mine[i] || null })).filter((p) => p.q);
    quiz = { qs: pairs.map((p) => p.q), answers: pairs.map((p) => p.mine), idx: 0, label: rec.label, marks: rec.marks || {}, elim: {} };
    showResult(pairs.map((p) => mkRes(p.q, p.mine)), rec.label, rec.ts);
  }
  function openHistory() { renderHistory(); show("viewHistory"); }
  $("historyBtn").onclick = openHistory;
  $("toHistBtn").onclick = openHistory;

  // ---- 回到最頂 ----
  const backToTop = $("backToTopBtn");
  function updateBackToTop() { backToTop.classList.toggle("show", window.scrollY >= 400); }
  window.addEventListener("scroll", updateBackToTop, { passive: true });
  backToTop.onclick = () => window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  updateBackToTop();

  renderSelect();
  offerResume();
})();
</script>
